<text x="500.0" y="581" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#18333a">Human review interruption</text>
<text x="500.0" y="610" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#18333a">Checkpoint the proposal and its fingerprint</text>
<rect x="195" y="705" width="610" height="85" rx="10" fill="#edf5f2" stroke="#7b9696" stroke-width="1.5"/>
<text x="500.0" y="736" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#18333a">Trusted host revalidation</text>
<text x="500.0" y="765" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#18333a">Check current revision and approved exact sessions</text>
<rect x="195" y="850" width="610" height="85" rx="10" fill="#edf5f2" stroke="#7b9696" stroke-width="1.5"/>
<text x="500.0" y="881" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#18333a">Save unconfirmed proposal</text>
<text x="500.0" y="910" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#18333a">Idempotent MCP save · recoverable persisted result</text>
