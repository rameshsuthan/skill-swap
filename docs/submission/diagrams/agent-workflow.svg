<polyline points="500,230 500,270" fill="none" stroke="#45636b" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="500,355 500,395" fill="none" stroke="#45636b" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="500,480 500,550" fill="none" stroke="#45636b" stroke-width="2" marker-end="url(#arrow)"/>
<polyline points="500,635 500,705" fill="none" stroke="#45636b" stroke-width="2" marker-end="url(#arrow)"/>
