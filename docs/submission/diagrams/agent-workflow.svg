<text x="500.0" y="301" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#18333a">Matching coordinator</text>
<text x="500.0" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#18333a">Search teachers → optional Pinecone → full cycle search</text>
<rect x="195" y="395" width="610" height="85" rx="10" fill="#edf5f2" stroke="#7b9696" stroke-width="1.5"/>
<text x="500.0" y="426" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#18333a">Feasibility reviewer</text>
<text x="500.0" y="455" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#18333a">Validate exact cycle and session times</text>
