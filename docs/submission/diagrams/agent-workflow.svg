<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1000" viewBox="0 0 1000 1000" role="img"><title>Agent workflow and human approval</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#45636b"/></marker></defs><rect width="100%" height="100%" fill="white"/>
<rect x="195" y="20" width="610" height="85" rx="10" fill="#edf5f2" stroke="#7b9696" stroke-width="1.5"/>
