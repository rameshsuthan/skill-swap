<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="910" viewBox="0 0 1000 910" role="img"><title>Exact approval and durable proposal saving</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#45636b"/></marker></defs><rect width="100%" height="100%" fill="white"/>
<rect x="10" y="15" width="200" height="85" rx="10" fill="#edf5f2" stroke="#7b9696" stroke-width="1.5"/>
<text x="110.0" y="46" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#18333a">Human and UI</text>
<text x="110.0" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#18333a">Review decision</text>
<path d="M110,100 V850" stroke="#a3b4b6" stroke-width="1.5" stroke-dasharray="5 5"/>
<rect x="270" y="15" width="200" height="85" rx="10" fill="#edf5f2" stroke="#7b9696" stroke-width="1.5"/>
<text x="370.0" y="46" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#18333a">Trusted host</text>
<text x="370.0" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#18333a">Approval boundary</text>
<path d="M370,100 V850" stroke="#a3b4b6" stroke-width="1.5" stroke-dasharray="5 5"/>
<rect x="535" y="15" width="200" height="85" rx="10" fill="#edf5f2" stroke="#7b9696" stroke-width="1.5"/>
<text x="635.0" y="46" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#18333a">Custom MCP</text>
<text x="635.0" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#18333a">Scope and validation</text>
<path d="M635,100 V850" stroke="#a3b4b6" stroke-width="1.5" stroke-dasharray="5 5"/>
<rect x="795" y="15" width="200" height="85" rx="10" fill="#edf5f2" stroke="#7b9696" stroke-width="1.5"/>
<text x="895.0" y="46" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#18333a">Domain SQLite</text>
<text x="895.0" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#18333a">Atomic persistence</text>
<path d="M895,100 V850" stroke="#a3b4b6" stroke-width="1.5" stroke-dasharray="5 5"/>
<polyline points="110,155 370,155" fill="none" stroke="#45636b" stroke-width="2" marker-end="url(#arrow)"/>
<text x="240.0" y="141" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#18333a">Approve staged fingerprint</text>
<polyline points="370,240 635,240" fill="none" stroke="#45636b" stroke-width="2" marker-end="url(#arrow)"/>
<text x="502.5" y="226" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#18333a">Revalidate exact sessions</text>
<polyline points="635,325 895,325" fill="none" stroke="#45636b" stroke-width="2" marker-end="url(#arrow)"/>
<text x="765.0" y="311" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#18333a">Read current facts and revision</text>
<polyline points="635,410 370,410" fill="none" stroke="#45636b" stroke-width="2" marker-end="url(#arrow)"/>
<text x="502.5" y="396" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#18333a">Return validated plan and fingerprint</text>
<polyline points="370,560 635,560" fill="none" stroke="#45636b" stroke-width="2" marker-end="url(#arrow)"/>
<text x="502.5" y="546" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#18333a">Save with stable idempotency key</text>
<polyline points="635,645 895,645" fill="none" stroke="#45636b" stroke-width="2" marker-end="url(#arrow)"/>
<text x="765.0" y="631" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#18333a">Validate and save atomically</text>
<polyline points="370,730 110,730" fill="none" stroke="#45636b" stroke-width="2" marker-end="url(#arrow)"/>
<text x="240.0" y="716" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#18333a">Display saved unconfirmed proposal</text>
<rect x="185" y="442" width="630" height="65" fill="#fff5e7" stroke="#b89d76"/>
<text x="500" y="468" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#18333a">If facts changed: return to planning and require fresh approval.</text>
<text x="500" y="492" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#18333a">No write is authorized by the old approval.</text>
<text x="500" y="810" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#18333a">If a save response is uncertain: look up status before any retry.</text>
<text x="500" y="878" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#18333a">Graph checkpoints retain the interruption; saved proposals retain timezone snapshots.</text>
</svg>