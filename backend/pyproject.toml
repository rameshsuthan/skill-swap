[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[project]
name = "skillswap"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi", "uvicorn", "pydantic>=2", "pydantic-settings", "fastmcp", "langgraph", "langgraph-checkpoint-sqlite", "langchain-google-genai", "tzdata", "httpx", "python-dotenv"]
[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "ruff"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
[tool.hatch.build.targets.wheel]
packages = ["src/skillswap"]
